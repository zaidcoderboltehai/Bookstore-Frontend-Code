<div class="order-confirmation-container" *ngIf="isVisible">
    <div class="order-confirmation-content">
      <!-- Header with Bookstore logo -->
      <header class="header">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" 
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
              class="book-icon">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>Bookstore</span>
        </div>
        
        <!-- User profile and cart -->
        <div class="user-actions">
          <a class="user-action">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Poonam</span>
          </a>
          
          <a class="user-action" routerLink="/cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Cart</span>
          </a>
        </div>
      </header>
      
      <!-- Success Message with Celebration Graphics -->
      <div class="success-container">
        <div class="celebration-graphics">
          <div class="star star1">★</div>
          <div class="star star2">★</div>
          <div class="star star3">★</div>
          <div class="confetti confetti1"></div>
          <div class="confetti confetti2"></div>
          <div class="confetti confetti3"></div>
          <div class="confetti confetti4"></div>
          <div class="confetti confetti5"></div>
          <div class="confetti confetti6"></div>
        </div>
        
        <h1 class="success-title">Order Placed Successfully</h1>
        
        <p class="success-message">
          hurray!!! your order is confirmed<br>
          the order id is {{ orderId }} save the order id for<br>
          further communication..
        </p>
      </div>
      
      <!-- Contact Information -->
      <div class="contact-info">
        <table class="contact-table">
          <tr>
            <th>Email us</th>
            <th>Contact us</th>
            <th>Address</th>
          </tr>
          <tr>
            <td>{{ email }}</td>
            <td>{{ phone }}</td>
            <td>{{ address }}</td>
          </tr>
        </table>
      </div>
      
      <!-- Continue Shopping Button -->
      <div class="action-buttons">
        <button class="continue-shopping-btn" (click)="continueToShopping()">CONTINUE SHOPPING</button>
      </div>
      
      <!-- Footer -->
      <footer class="footer">
        <div class="footer-content">
          Copyright © 2020, Bookstore Private Limited. All Rights Reserved
        </div>
      </footer>
    </div>
  </div>
