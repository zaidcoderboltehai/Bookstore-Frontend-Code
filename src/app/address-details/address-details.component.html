<div class="address-details-container" *ngIf="isVisible">
    <div class="address-details-content">
      <h2 class="section-title">Customer Details</h2>
      
      <div class="add-new-btn-container">
        <button class="add-new-btn" (click)="addNewAddress()">Add New Address</button>
      </div>
      
      <div class="customer-info">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="customerName" placeholder="Enter your full name">
        </div>
      </div>
      
      <div class="address-list">
        <!-- Existing Addresses -->
        <div *ngFor="let address of addresses; let i = index" class="address-item" [class.selected]="selectedAddressId === address.id" (click)="selectAddress(address.id)">
          <div class="address-type">
            <span class="type-indicator">{{ i + 1 }}</span>
            <span class="type-name">{{ address.type }}</span>
            <button class="edit-btn" (click)="editAddress(address.id); $event.stopPropagation()">Edit</button>
          </div>
          
          <div class="address-details">
            <div class="form-group">
              <label>Address</label>
              <textarea [(ngModel)]="address.addressLine" [disabled]="!isEditing || editingAddressId !== address.id"></textarea>
            </div>
            
            <div class="address-meta-fields">
              <div class="form-group">
                <label>City/Town</label>
                <input type="text" [(ngModel)]="address.city" [disabled]="!isEditing || editingAddressId !== address.id">
              </div>
              
              <div class="form-group">
                <label>State</label>
                <input type="text" [(ngModel)]="address.state" [disabled]="!isEditing || editingAddressId !== address.id">
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Continue Button -->
      <div class="action-buttons">
        <button class="continue-btn" (click)="continueToPayment()">CONTINUE</button>
      </div>
      
      <!-- Order Summary Component -->
      <app-order-summary 
        [isVisible]="showOrderSummary"
        [orderDetails]="{
          title: 'Don\'t Make Me Think',
          author: 'Steve Krug',
          price: 1500,
          originalPrice: 2000,
          imageUrl: 'assets/images/Image 11@2x.png'
        }"
        (checkout)="handleCheckout()"
      ></app-order-summary>
    </div>
  </div>
  
  <!-- Order Confirmation Component -->
  <app-order-confirmation [isVisible]="showOrderConfirmation"></app-order-confirmation>
