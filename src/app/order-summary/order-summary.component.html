<div class="order-summary-container" *ngIf="isVisible">
  <div class="order-summary-content">
    <h2 class="section-title">Order summary</h2>
    
    <div class="order-item">
      <div class="item-image">
        <img [src]="orderDetails.imageUrl" [alt]="orderDetails.title">
      </div>
      <div class="item-details">
        <h3 class="item-title">{{ orderDetails.title }}</h3>
        <p class="item-author">by {{ orderDetails.author }}</p>
        <p class="item-price">Rs. {{ orderDetails.price }}</p>
      </div>
    </div>
    
    <!-- Order Summary Section -->
    <div class="summary-block">
      <div class="summary-row">
        <span class="summary-label">Items ({{ cartItems.length }}):</span>
        <span class="summary-value">Rs. {{ getTotal() }}</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Delivery:</span>
        <span class="summary-value">Rs. 40</span>
      </div>
      <div class="summary-row total">
        <span class="summary-label">Total:</span>
        <span class="summary-value">Rs. {{ getTotal() + 40 }}</span>
      </div>
    </div>

    <div class="checkout-action">
      <button class="checkout-btn" (click)="onCheckout()">CHECKOUT</button>
    </div>
  </div>
</div>
