<div class="reset-password-container">
    <div class="reset-password-card">
      <h2 class="title">Reset Your Password</h2>
      <p class="subtitle">Enter your new password below</p>
      
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input 
            type="password" 
            id="newPassword" 
            formControlName="newPassword" 
            class="form-control" 
            placeholder="Enter new password"
          >
          <div *ngIf="f['newPassword'].touched && f['newPassword'].errors" class="text-danger">
            <div *ngIf="f['newPassword'].errors['required']">Password is required</div>
            <div *ngIf="f['newPassword'].errors['minlength']">Password must be at least 6 characters</div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            class="form-control" 
            placeholder="Confirm new password"
          >
          <div *ngIf="f['confirmPassword'].touched && f['confirmPassword'].errors" class="text-danger">
            <div *ngIf="f['confirmPassword'].errors['required']">Confirm password is required</div>
          </div>
          <div *ngIf="resetPasswordForm.errors?.['mismatch'] && f['confirmPassword'].touched" class="text-danger">
            Passwords do not match
          </div>
        </div>
        
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
        
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>
        
        <button type="submit" class="btn btn-primary" [disabled]="resetPasswordForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Resetting...' : 'Reset Password' }}
        </button>
        
        <div class="back-to-login">
          <a routerLink="/auth/login">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
